spring.application.name=recipe-app
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC


spring.datasource.username=${MYSQ_LUSER}
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.security.oauth2.resourceserver.jwt.audience=https://recipe-app
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://choresapp.auth0.com/