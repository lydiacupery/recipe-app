spring.application.name=recipe-app
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC


spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.security.oauth2.resourceserver.jwt.audience=https://recipe-app
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://choresapp.auth0.com/

# OpenAI API Configuration
openai.api.key=${OPENAI_API_KEY}

# Logging Configuration
logging.level.com.lcupery.recipe_app.service.RecipeExtractorService=DEBUG
logging.level.com.lcupery.recipe_app.controller.RecipeController=DEBUG