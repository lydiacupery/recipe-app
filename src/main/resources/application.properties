spring.application.name=recipe-app
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC


spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.security.oauth2.resourceserver.jwt.audience=https://recipe-app
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://choresapp.auth0.com/

# OpenAI API Configuration
openai.api.key=${OPENAI_API_KEY}

# Jina AI Configuration (for webpage fetching)
# Set to false if you keep getting blocked by Jina AI
jina.enabled=true

# Vercel Blob Configuration
vercel.blob.token=${VERCEL_BLOB_TOKEN}

# Multipart File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging Configuration
logging.level.com.lcupery.recipe_app.service.RecipeExtractorService=INFO
logging.level.com.lcupery.recipe_app.controller.RecipeController=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO